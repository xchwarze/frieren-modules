name: USB storage safety tests

on:
  pull_request:
    paths:
      - 'usbstorage/**'
      - '.github/workflows/usbstorage-tests.yml'
  push:
    branches: [master, fix/usbstorage-safe-setup]
    paths:
      - 'usbstorage/**'
      - '.github/workflows/usbstorage-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shell syntax (including existing hotplug loader)
        run: |
          for script in usbstorage/public/bin/*.sh usbstorage/public/files/20-sd-loader; do
            sh -n "$script" || exit 1
          done
      # The unchanged hotplug loader has 14 pre-existing ShellCheck diagnostics.
      # Analyze the scoped bin scripts without suppressing their diagnostics.
      - run: shellcheck -x -P usbstorage/public/bin usbstorage/public/bin/*.sh
      - name: Synthetic storage policy and execution fixtures (no hardware)
        run: python3 -m unittest discover -s usbstorage/tests-shell -p 'test_*.py' -v

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find usbstorage/public usbstorage/tests-php -name '*.php' -print0 | xargs -0 -n1 php -n -l
      - run: php -n usbstorage/tests-php/storage_test.php

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modules/usbstorage
    env:
      VITE_COMMON_ALIAS: ../../frieren/frieren-front/src
      # Existing production config enables an interactive browser-opening analyzer.
      VITE_ANALYZER_ENABLE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          path: modules
      - uses: actions/checkout@v4
        with:
          repository: xchwarze/frieren
          # Read-only shared source, matching the reviewed local dependency.
          ref: fe87f8f36c2147d8ed6c11a59b0e11c8c99ee9ec
          path: frieren
      # Do not request setup-node's Yarn cache before Corepack is enabled.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn test
      - run: corepack yarn build
      - run: corepack yarn validate
      - name: Package and manifest versions match
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const read = p => JSON.parse(fs.readFileSync(p)); if (read('package.json').version !== read('public/manifest.json').version) process.exit(1);"
